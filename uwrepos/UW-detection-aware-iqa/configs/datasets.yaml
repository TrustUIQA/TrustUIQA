# Core datasets: ONE subjective (MOS) dataset + ONE detection dataset.
# Paths are relative to DATA_ROOT, or set <NAME>_ROOT (e.g. UID2021_ROOT) to
# an absolute path — handy on Kaggle where inputs live in /kaggle/input/<slug>.
#
# builder: table | detection | uieb | euvp_test
# Run:  python scripts/build_manifests.py --only uid2021

uid2021:            # O1 + O2. Hou et al., ACM TOMM 2023. 60 raw + 900 enhanced (15 methods), MOS from 77 observers
  root: UID2021     # names: SI_B_1 (raw), ERI_B_1_HP (enhanced, method HP); subsets B, BG, G, H, LL, T
  builder: table
  table: TODO       # run uwiqa.data.inspect_dataset(root) and copy the MOS file's relative path here
  image_col: TODO   # column holding the image name
  mos_col: TODO     # column holding the MOS
  image_dir: auto   # find images by file stem anywhere under root
  scene_regex: "^(?:SI|ERI)_([A-Za-z]+_\\d+)"
  method_regex: "^ERI_[A-Za-z]+_\\d+_(.+)$"
  method_default: raw

# Detection data: Kaggle "skycol/underwater-domain-in-odverse33" (CC BY-NC-SA 4.0),
# YOLO format, re-split by the ODverse33 benchmark (RUOD test = 1,400 images,
# NOT the original 4,200). Attach it in Kaggle and set RUOD_ROOT / DUO_ROOT, e.g.
#   /kaggle/input/underwater-domain-in-odverse33/Underwater/RUOD

ruod:               # O3 + O4. Fu et al., Neurocomputing 2023. 10 classes. Layout: <split>/images
  root: Underwater/RUOD
  builder: yolo

duo:                # O5 cross-dataset check. Liu et al., ICMEW 2021. 4 classes. Layout: images/<split>
  root: Underwater/DUO
  builder: yolo

